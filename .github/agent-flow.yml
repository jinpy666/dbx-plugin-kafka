version: 1
plugin: dbx-plugin-kafka
base_branch: main
branch_prefix: codex/kafka/
workflow:
  stages: [discovery, contract, implementation, review, integration, verification]
  merge_policy: integrator_only
  implementation_isolation: one_branch_per_agent
  dependencies:
    implementation: [contract]
    review: [implementation]
    integration: [review]
    verification: [integration]
ownership:
  # manifest.json（含 version 等发布元数据）单一归属 contract lane——此前
  # contract 与 frontend 双写，与 AGENTS.md「integrator owns shared contract
  # files / 不动版本元数据」矛盾；frontend lane 需要改 manifest 时经 contract
  # 阶段提需求单。
  contract: [manifest.json, docs/PROTOCOL_KAFKA.zh-CN.md]
  backend: [backend/]
  frontend: [frontend/]
  tests: [scripts/]
  integrator: [ui/, dist/, version_metadata, shared_contract_docs]
validation:
  local:
    - python3 scripts/validate_repo.py
    - node scripts/connection-forms/verify.mjs kafka
    - pnpm --dir frontend typecheck
    - pnpm --dir frontend test
    - pnpm --dir frontend build
    - '(cd backend && gofmt -l main.go internal | test -z "$(cat)" )'
    - '(cd backend && go vet ./... && go test ./...)'
  ci_required: [validate, frontend, backend, integration, candidates-check]
security:
  secrets: ephemeral_only
  production_access: forbidden
  generated_artifacts: integrator_only

