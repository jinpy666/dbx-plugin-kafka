name: Kafka plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless spend now that CI includes a
# container integration matrix; keep the latest only (never cancel a release
# branch's own in-flight run since releases are cut from tags, not PRs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PLUGIN_CLI_VERSION: "0.1.3"
  # Windows runners default python stdout to cp1252; the smoke script prints
  # Unicode (→, ✓) and would die on UnicodeEncodeError. UTF-8 mode is a no-op
  # on the other platforms.
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Validate repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python3 scripts/validate_repo.py
      - run: node scripts/connection-forms/verify.mjs kafka

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      # setup-node 的 pnpm 缓存需要 pnpm 已在 PATH 中，故置于 pnpm/action-setup 之后
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      # ui/index.html 已脱库：发布与候选打包各自现构建前端，PR 不再被
      # 「integrator 忘了重新生成 ui/」卡红（原 freshness 门已移除）。
      # Headless Chrome walkthrough against the mock host (mounts the app,
      # zero page errors, MCP ui-intent roundtrip). SKIPs by design when no
      # Chrome is available; ubuntu-24.04 runners ship google-chrome.
      - name: UI walkthrough (headless Chrome)
        run: node scripts/ui_test.mjs

  backend:
    name: Go sidecar checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: backend/go.sum
      # Module downloads need the network; go.sum pins every version. The
      # vendored SDK (shared/sdk/go/dbx-plugin-sdk) is resolved through the
      # backend/go.mod replace, no host checkout required.
      - name: gofmt clean
        run: |
          unformatted="$(cd backend && gofmt -l main.go internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: (cd backend && go vet ./... && go test ./...)

  integration:
    name: Container integration smoke
    needs: [validate, frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: backend/go.sum
      - name: Build sidecar
        run: (cd backend && CGO_ENABLED=0 go build -trimpath -o bin/dbx-plugin-kafka .)
      # smoke_container.py brings up docker-compose.kafka-test.yml (apache/kafka
      # KRaft + redpanda SR + SASL/PLAIN and SSL/mTLS clusters), probes real
      # readiness (metadata / GET /subjects / auth handshakes), seeds topics,
      # runs scripts/smoke_test.py (S1-S17) and scripts/smoke_mcp.py (K1-K19)
      # against the live clusters, and always tears down.
      # KAFKA_TEST_REQUIRE=1 turns "no broker / no sidecar / init failure"
      # into FAIL; env-gated scenarios (AWS Glue S12, OAUTHBEARER S15) still
      # SKIP without their credentials, by design. SASL credentials for S16
      # are throwaway values exported by the orchestrator.
      - name: Run Kafka container smoke (S1-S17 + MCP K1-K19),
        env:
          KAFKA_TEST_REQUIRE: "1"
          PYTHONUTF8: "1"
        run: python3 scripts/smoke_container.py

  candidate:
    name: Package candidate (${{ matrix.target }})
    needs: [validate, frontend, backend]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            target: linux-x64
            python: python3
          - os: linux
            runner: ubuntu-24.04-arm
            target: linux-arm64
            python: python3
          - os: macos
            runner: macos-15
            target: darwin-arm64
            python: python3
          - os: macos
            runner: macos-15-intel
            target: darwin-x64
            python: python3
          - os: windows
            runner: windows-2022
            target: windows-x64
            python: python
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: backend/go.sum
      # Warm the module/download caches once so build.sh's go build and the
      # CLI's own rebuild of the sidecar both run offline-fast.
      - name: Pre-download Go modules
        run: (cd backend && go mod download)
      - run: pnpm --dir frontend install --frozen-lockfile
      # Install the CLI before build.sh: its packaging step calls the native
      # plugin-cli directly (resolve_native_plugin_cli).
      - run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"
      # build.sh runs the frontend three-step, builds the sidecar into
      # backend/bin (local smoke target) and packages the .dbxp via the native
      # plugin-cli for the running platform, with DBX_PLUGIN_TARGET steering
      # the cross-compile.
      - name: Build and package candidate
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
          NO_COLOR: "1"
        run: bash scripts/build.sh
      - name: Offline MCP smoke
        run: |
          SIDECAR="$PWD/backend/bin/dbx-plugin-kafka"
          [ -f "$SIDECAR.exe" ] && SIDECAR="$SIDECAR.exe"
          DBX_PLUGIN_SIDECAR="$SIDECAR" ${{ matrix.python }} scripts/smoke_mcp.py
      - uses: actions/upload-artifact@v7
        with:
          name: dbx-plugin-kafka-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.dbxp
            dist/*.artifact.json

  candidates-check:
    name: Cross-target candidate checks
    needs: [candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dbx-plugin-kafka-*
          path: dist
          merge-multiple: true
      - run: python3 scripts/check_candidates.py dist --expect linux-x64,linux-arm64,darwin-arm64,darwin-x64,windows-x64
