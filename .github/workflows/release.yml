name: Release DBX Kafka plugin

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  PLUGIN_CLI_VERSION: "0.1.3"
  # Windows runners default python stdout to cp1252; UTF-8 mode is a no-op
  # on the other platforms.
  PYTHONUTF8: "1"

jobs:
  validate:
    if: startsWith(github.event.release.tag_name, 'kafka-v')
    name: Validate Kafka release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache-dependency-path: backend/go.sum
      # The release event fires as soon as the release is published; if the
      # tagged commit was never gated by CI (or regressed), a failed build
      # would leave a broken release behind. Re-run the check suite here so
      # the 5-platform build only starts on a verified tree.
      - name: Validate manifest and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/validate_repo.py
          node scripts/connection-forms/verify.mjs kafka
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          import pathlib
          import sys
          version = json.loads(pathlib.Path("manifest.json").read_text())["version"]
          expected = f"kafka-v{version}"
          if sys.argv[1] != expected:
              raise SystemExit(f"release tag {sys.argv[1]!r} does not match {expected!r}")
          PY
      - name: Frontend checks
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
          if ! git diff --quiet -- ui/; then
            git diff --stat -- ui/
            echo "ui/ is stale: run 'pnpm --dir frontend build' and commit the output" >&2
            exit 1
          fi
      - name: Go sidecar checks
        run: |
          unformatted="$(cd backend && gofmt -l main.go internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed: $unformatted" >&2
            exit 1
          fi
          (cd backend && go vet ./... && go test ./...)

  build:
    if: startsWith(github.event.release.tag_name, 'kafka-v')
    name: Build ${{ matrix.target }}
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            target: linux-x64
          - os: linux
            runner: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos
            runner: macos-15
            target: darwin-arm64
          - os: macos
            runner: macos-15-intel
            target: darwin-x64
          - os: windows
            runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache-dependency-path: backend/go.sum
      - name: Pre-download Go modules
        run: (cd backend && go mod download)
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: npm install --global "@dbx-app/plugin-cli@${PLUGIN_CLI_VERSION}"
      - name: Build and package release candidate
        env:
          DBX_PLUGIN_TARGET: ${{ matrix.target }}
          NO_COLOR: "1"
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dbx-plugin-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.dbxp
            dist/*.artifact.json

  publish:
    if: startsWith(github.event.release.tag_name, 'kafka-v')
    name: Publish plugin release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dbx-plugin-*
          path: dist
          merge-multiple: true
      - name: Validate candidates and merge metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/check_candidates.py dist \
            --expect linux-x64,linux-arm64,darwin-arm64,darwin-x64,windows-x64 \
            --write-release-candidates dist/release-candidates.json
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -d '' packages < <(find dist -type f -name '*.dbxp' -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No .dbxp packages were downloaded" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${packages[@]}" dist/release-candidates.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
