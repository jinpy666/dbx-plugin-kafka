# Disposable Kafka/Connect acceptance stack; no host or production credentials.
services:
  kafka:
    image: apache/kafka:4.3.1
    ports: ["127.0.0.1:${CONNECT_TEST_KAFKA_PORT:-39092}:39092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:39092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${CONNECT_TEST_KAFKA_PORT:-39092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 18
      start_period: 10s
  connect:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["127.0.0.1:${CONNECT_TEST_HTTP_PORT:-38083}:8083"]
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    mem_limit: 768m
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        mkdir -p /tmp/connect-plugins
        cp /opt/kafka/libs/connect-file-*.jar /tmp/connect-plugins/
        cat > /tmp/connect.properties <<'CONFIG'
        bootstrap.servers=kafka:9092
        group.id=dbx-connect-smoke
        key.converter=org.apache.kafka.connect.storage.StringConverter
        value.converter=org.apache.kafka.connect.storage.StringConverter
        config.storage.topic=dbx-connect-config
        offset.storage.topic=dbx-connect-offset
        status.storage.topic=dbx-connect-status
        config.storage.replication.factor=1
        offset.storage.replication.factor=1
        status.storage.replication.factor=1
        offset.flush.interval.ms=1000
        listeners=http://0.0.0.0:8083
        rest.advertised.host.name=connect
        plugin.path=/tmp/connect-plugins
        plugin.discovery=service_load
        CONFIG
        printf 'dbx-connect-acceptance\n' > /tmp/dbx-connect-input.txt
        exec /opt/kafka/bin/connect-distributed.sh /tmp/connect.properties
